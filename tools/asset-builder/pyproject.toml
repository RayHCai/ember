[project]
name = "ember-asset-builder"
version = "0.0.0"
description = "Generates the low-poly 3D models in assets/."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.scripts]
asset-builder = "ember_asset_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
