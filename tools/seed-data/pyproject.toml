[project]
name = "ember-seed-data"
version = "0.0.0"
description = "Seed data generators for the api database."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.8"]

[project.scripts]
ember-seed-data = "ember_seed_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
