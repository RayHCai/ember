name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
    contents: read

env:
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1

jobs:
    ci:
        name: ${{ matrix.task.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # Installed below, so an absence here is a broken install, not a skip.
            EMBER_REQUIRE_TOOLCHAIN: go,uv
            # PRs check only what the change reaches; main checks everything.
            TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
            AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        strategy:
            fail-fast: false
            matrix:
                task:
                    - name: lint
                      run: pnpm run lint
                    - name: format
                      run: pnpm run format:check
                    - name: typecheck
                      run: pnpm run typecheck $AFFECTED
                    - name: build
                      run: pnpm run build $AFFECTED
                    - name: test
                      run: pnpm run test $AFFECTED
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.mod
            - uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true
            - run: uv sync --all-packages --frozen
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .turbo
                  key: turbo-${{ matrix.task.name }}-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-${{ matrix.task.name }}-${{ runner.os }}-
            - name: ${{ matrix.task.name }}
              run: ${{ matrix.task.run }}

    go-race:
        name: go race
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.mod
            - run: go test -race -count=1 -shuffle=on ./...

    commits:
        name: conventional commits
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0
            - name: Check every commit subject in the PR
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  bad=$(git log --format=%s "$BASE..$HEAD" \
                    | grep -vE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .+' || true)
                  [ -z "$bad" ] || { echo "Non-conventional commits:"; echo "$bad"; exit 1; }

    # The one required status check for branch protection.
    ci-ok:
        name: CI passed
        if: always()
        needs: [ci, go-race, commits]
        runs-on: ubuntu-latest
        steps:
            - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
