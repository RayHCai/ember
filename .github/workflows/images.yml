name: Images

# One definition of every service image: CI builds them to prove the Dockerfiles work, release
# pushes them to GHCR.
on:
    workflow_call:
        inputs:
            push:
                type: boolean
                required: true
            version:
                description: Release tag the pushed images carry, e.g. v1.2.0
                type: string
                default: ''

# Permissions come from the caller: read-only from CI, packages: write from release.
jobs:
    image:
        name: ${{ matrix.service }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - service: api
                      dockerfile: docker/node.Dockerfile
                      args: |
                          PACKAGE=@ember/api
                          DIR=services/api
                    - service: drone-info
                      dockerfile: docker/node.Dockerfile
                      args: |
                          PACKAGE=@ember/drone-info
                          DIR=services/drone-info
                    - service: operator-agent
                      dockerfile: docker/node.Dockerfile
                      args: |
                          PACKAGE=@ember/operator-agent
                          DIR=services/operator-agent
                    - service: edge-manager
                      dockerfile: docker/go.Dockerfile
                      args: SERVICE=edge-manager
                    - service: edge-connector
                      dockerfile: docker/go.Dockerfile
                      args: SERVICE=edge-connector
                    - service: planner
                      dockerfile: docker/python.Dockerfile
                      args: |
                          PACKAGE=ember-planner
                          SCRIPT=ember-planner
                    - service: operator-uagent
                      dockerfile: docker/python.Dockerfile
                      args: |
                          PACKAGE=ember-operator-uagent
                          SCRIPT=ember-operator-uagent
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
            - if: inputs.push
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Lowercases the image name: GHCR rejects the repository's mixed-case owner.
            - id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
              with:
                  images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
                      type=sha
                      type=raw,value=latest,enable=${{ inputs.push }}
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  build-args: ${{ matrix.args }}
                  push: ${{ inputs.push }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: ${{ inputs.push && 'mode=max' || 'false' }}
                  sbom: ${{ inputs.push }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}
