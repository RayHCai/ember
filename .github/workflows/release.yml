name: Release

# CD: release-please opens a release PR from conventional commits on main; merging it tags a
# release, which pushes service images to GHCR and attaches dashboard installers.
on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write
    packages: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            released: ${{ steps.rp.outputs.release_created }}
            tag: ${{ steps.rp.outputs.tag_name }}
        steps:
            - id: rp
              uses: googleapis/release-please-action@v4
              with:
                  release-type: simple

    images:
        needs: release-please
        if: needs.release-please.outputs.released == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - api
                    - drone-info
                    - messenger
                    - civilian-agent
                    - voice-agent
                    - operator-agent
                    - edge-manager
                    - edge-connector
                    - planner
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - name: Skip services without a Dockerfile yet
              id: has
              run: echo "dockerfile=$([ -f services/${{ matrix.service }}/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            - if: steps.has.outputs.dockerfile == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - if: steps.has.outputs.dockerfile == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: services/${{ matrix.service }}/Dockerfile
                  push: true
                  tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ needs.release-please.outputs.tag }}

    dashboard:
        needs: release-please
        if: needs.release-please.outputs.released == 'true'
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest, ubuntu-22.04]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - name: Skip until the Tauri shell is scaffolded
              id: has
              shell: bash
              run: echo "tauri=$([ -f apps/dashboard/src-tauri/Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            - if: steps.has.outputs.tauri == 'true'
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - if: steps.has.outputs.tauri == 'true'
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - if: steps.has.outputs.tauri == 'true' && runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - if: steps.has.outputs.tauri == 'true'
              run: pnpm install --frozen-lockfile
            - if: steps.has.outputs.tauri == 'true'
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: apps/dashboard
                  tagName: ${{ needs.release-please.outputs.tag }}
