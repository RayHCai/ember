name: Release

# CD: release-please opens a release PR from conventional commits on master; merging it tags a
# release, which pushes service images to GHCR and attaches dashboard installers.
on:
    push:
        branches: [master]

concurrency:
    group: release
    cancel-in-progress: false

permissions: {}

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            released: ${{ steps.rp.outputs.release_created }}
            tag: ${{ steps.rp.outputs.tag_name }}
        steps:
            - id: rp
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  release-type: simple

    images:
        needs: release-please
        if: needs.release-please.outputs.released == 'true'
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/images.yml
        with:
            push: true
            version: ${{ needs.release-please.outputs.tag }}

    dashboard:
        needs: release-please
        if: needs.release-please.outputs.released == 'true'
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest, ubuntu-22.04]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - name: Skip until the Tauri shell is scaffolded
              id: has
              shell: bash
              run: echo "tauri=$([ -f apps/dashboard/src-tauri/Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            - if: steps.has.outputs.tauri == 'true'
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - if: steps.has.outputs.tauri == 'true'
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - if: steps.has.outputs.tauri == 'true'
              uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
              with:
                  toolchain: stable
            - if: steps.has.outputs.tauri == 'true' && runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - if: steps.has.outputs.tauri == 'true'
              run: pnpm install --frozen-lockfile
              env:
                  EMBER_SKIP_HOOKS: 1
            - if: steps.has.outputs.tauri == 'true'
              uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: apps/dashboard
                  tagName: ${{ needs.release-please.outputs.tag }}
