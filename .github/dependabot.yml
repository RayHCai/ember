version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule: { interval: weekly }
    - package-ecosystem: npm
      directory: /
      schedule: { interval: weekly }
      groups: { npm: { patterns: ['*'] } }
    - package-ecosystem: gomod
      directory: /
      schedule: { interval: weekly }
    - package-ecosystem: uv
      directory: /
      schedule: { interval: weekly }
