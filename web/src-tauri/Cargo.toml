[package]
name = "ember"
version = "0.1.0"
description = "Ember wildfire watch operator console"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"

# Keep debug builds small: line tables for our code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
