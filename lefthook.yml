pre-commit:
    parallel: true
    jobs:
        - name: format
          glob: '*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}'
          run: pnpm exec prettier --write {staged_files}
          stage_fixed: true

        - name: lint-ts
          glob: '*.{ts,tsx,js,mjs,cjs}'
          run: pnpm exec oxlint --deny-warnings {staged_files}

        - name: python
          glob: '*.py'
          run: node scripts/uv.mjs run ruff format {staged_files} && node scripts/uv.mjs run ruff check --fix {staged_files}
          stage_fixed: true

        - name: go-format
          glob: '*.go'
          run: node scripts/gofmt-check.mjs {staged_files}

        - name: rust-format
          glob: '*.rs'
          root: 'apps/dashboard/src-tauri/'
          run: node ../../../scripts/cargo.mjs fmt --check

        - name: rust-format-sim
          glob: '*.rs'
          root: 'apps/drone-sim/src-tauri/'
          run: node ../../../scripts/cargo.mjs fmt --check

        - name: no-secrets
          run: node scripts/check-secrets.mjs {staged_files}

pre-push:
    jobs:
        - name: typecheck
          run: pnpm run typecheck
        - name: test
          run: pnpm run test

commit-msg:
    jobs:
        - name: conventional-commit
          run: |
              head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .{1,}' \
                || { echo 'Commit message must follow Conventional Commits, e.g. feat(api): add watch-zone routes'; exit 1; }

# Post-commit is advisory only: it never blocks, it reminds.
post-commit:
    jobs:
        - name: work-log-reminder
          run: node scripts/post-commit.mjs
