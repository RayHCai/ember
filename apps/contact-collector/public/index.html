<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0b0706" />
        <title>Ember</title>
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <script>
            document.documentElement.classList.add('js');
        </script>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <canvas id="bg" aria-hidden="true"></canvas>
        <div id="curtain" aria-hidden="true"></div>
        <div id="flash" aria-hidden="true"></div>
        <main>
            <h1><img src="/icon.svg" alt="" />ember</h1>
            <form id="signup" action="/api/subscribe" method="post">
                <div class="slider">
                    <div class="slide field" data-step="phone" data-state="active">
                        <input
                            name="phone"
                            type="tel"
                            inputmode="tel"
                            autocomplete="tel-national"
                            enterkeyhint="next"
                            placeholder="Phone number"
                            aria-label="Phone number"
                            required
                            maxlength="14"
                        />
                        <button type="button" class="action next" aria-label="Next" disabled>
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 12h14M13 6l6 6-6 6" />
                            </svg>
                        </button>
                    </div>
                    <div class="slide" data-step="zip" data-state="ahead">
                        <div class="field">
                            <button
                                type="button"
                                class="back"
                                id="back"
                                aria-label="Back to phone number"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M19 12H5M11 6l-6 6 6 6" />
                                </svg>
                            </button>
                            <input
                                name="zip"
                                type="text"
                                inputmode="numeric"
                                autocomplete="postal-code"
                                enterkeyhint="done"
                                placeholder="ZIP code"
                                aria-label="ZIP code"
                                required
                                maxlength="5"
                                pattern="[0-9]{5}"
                            />
                        </div>
                        <button type="submit" class="submit">Notify me</button>
                    </div>
                    <div class="slide" data-step="done" data-state="ahead">
                        <button
                            type="button"
                            class="field again"
                            id="again"
                            aria-label="Signed up. Add another number"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 12.5l4.5 4.5L19 7.5" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="hp" aria-hidden="true">
                    <input name="website" type="text" tabindex="-1" autocomplete="off" />
                </div>
                <p id="status" class="sr-only" role="alert"></p>
            </form>
        </main>
        <script type="module" src="/scene.js"></script>
        <script type="module" src="/app.js"></script>
    </body>
</html>
