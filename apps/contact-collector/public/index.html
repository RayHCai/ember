<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#e5321f" />
        <title>Ember</title>
        <script>
            document.documentElement.classList.add('js');
        </script>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <canvas id="bg" aria-hidden="true"></canvas>
        <div id="curtain" aria-hidden="true"></div>
        <div id="flash" aria-hidden="true"></div>
        <main>
            <h1 id="wordmark">Ember</h1>
            <p class="tagline">Wildfire alerts for where you live.</p>
            <form id="signup" action="/api/subscribe" method="post">
                <div class="steps">
                    <div class="step field" data-step="email" data-state="active">
                        <input
                            name="email"
                            type="email"
                            inputmode="email"
                            autocomplete="email"
                            autocapitalize="off"
                            spellcheck="false"
                            enterkeyhint="next"
                            placeholder="Email address"
                            aria-label="Email address"
                            required
                            maxlength="254"
                        />
                        <button type="button" class="action next" aria-label="Next" disabled>
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 12h14M13 6l6 6-6 6" />
                            </svg>
                        </button>
                    </div>
                    <div class="step field" data-step="zip" data-state="ahead">
                        <input
                            name="zip"
                            type="text"
                            inputmode="numeric"
                            autocomplete="postal-code"
                            enterkeyhint="done"
                            placeholder="ZIP code"
                            aria-label="ZIP code"
                            required
                            maxlength="5"
                            pattern="[0-9]{5}"
                        />
                        <button type="submit" class="action submit">Notify me</button>
                    </div>
                    <div class="step thanks" data-step="done" data-state="ahead" tabindex="-1">
                        <p class="done-title">You're on the list.</p>
                        <p id="done-detail"></p>
                        <button type="button" class="link" id="again">Add another email</button>
                    </div>
                </div>
                <div class="hp" aria-hidden="true">
                    <input name="website" type="text" tabindex="-1" autocomplete="off" />
                </div>
                <div class="under">
                    <button type="button" class="link" id="back" hidden></button>
                    <p id="status" class="error" role="alert"></p>
                </div>
            </form>
        </main>
        <script type="module" src="/scene.js"></script>
        <script type="module" src="/app.js"></script>
    </body>
</html>
