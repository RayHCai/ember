<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ember Drone Sim</title>
        <link rel="stylesheet" href="/src/styles.css" />
    </head>
    <body>
        <canvas id="view"></canvas>
        <div id="status"></div>
        <form id="connect" hidden>
            <img id="mark" alt="" width="72" height="72" />
            <label for="drone">Connect to a drone</label>
            <input
                id="drone"
                name="drone"
                placeholder="Drone ID or address"
                autocomplete="off"
                spellcheck="false"
            />
            <button type="submit">Connect</button>
            <button type="button" class="secondary" disabled title="Not available yet">
                Connect over USB
            </button>
        </form>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
