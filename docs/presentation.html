<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gloock&display=swap" rel="stylesheet">
<style>
@property --r{syntax:'<percentage>';inherits:false;initial-value:100%}
@property --q{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --m{syntax:'<percentage>';inherits:false;initial-value:-14%}
:root{
 --ground:#0b0706;--light:#fff7f2;--light-2:rgba(255,247,242,.72);
 --paper:#ffffff;--wash:#f7f6f3;--line:#e9e7e2;--line-strong:#d3d0c9;
 --ink:#111110;--ink-2:#55534d;--ink-3:#7b7871;
 --fire:#e5321f;--fire-deep:#c41f14;--flame:#ff7a1a;--glow:#ffb938;--route:#12a37a;
 --font-serif:'Gloock','Didot','Bodoni MT',Georgia,serif;
 --font-sans:'Atkinson Hyperlegible','Avenir Next','Segoe UI',sans-serif;
 --font-mono:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
 --shadow-md:0 0 0 1px rgba(17,17,16,.06),0 6px 16px -6px rgba(17,17,16,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ground);overflow:hidden;color:var(--light);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;background:var(--ground)}
.scene{position:absolute;inset:0;visibility:hidden;overflow:hidden;background:var(--ground)}
.scene.on{visibility:visible}
.lay{position:absolute;inset:-6%}
.lay svg{width:100%;height:100%;display:block}
.cam{animation:cam var(--d,30s) ease-in-out infinite alternate;will-change:transform;transform-origin:50% 60%}
@keyframes cam{from{transform:translate3d(var(--x0,0%),var(--y0,0%),0) scale(var(--s0,1.03))}to{transform:translate3d(var(--x1,0%),var(--y1,0%),0) scale(var(--s1,1.12))}}
.bl{animation:bl 2.4s ease-in-out infinite alternate}
@keyframes bl{0%{opacity:.2}35%{opacity:1}70%{opacity:.45}100%{opacity:.95}}
.smk{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(26,14,11,.85),rgba(26,14,11,0));animation:smk 40s ease-in-out infinite alternate}
@keyframes smk{from{transform:translateX(-8%) scale(1)}to{transform:translateX(12%) scale(1.25)}}
.cl{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));animation:smk 60s ease-in-out infinite alternate}
.g3{position:absolute;inset:0;width:100%;height:100%;display:block}
.dim{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 46%,rgba(11,7,6,.42),rgba(11,7,6,0) 100%),linear-gradient(rgba(11,7,6,.3),rgba(11,7,6,.05) 45%,rgba(11,7,6,.25));pointer-events:none}

/* type */
.txt{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-serif);font-weight:400;line-height:1.1;letter-spacing:0;color:var(--light);text-shadow:0 1px 14px rgba(11,7,6,.45);padding:0 6vw;animation:flt 8s ease-in-out infinite alternate;z-index:12}
@keyframes flt{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
.w{display:inline-block;margin:0 .14em;will-change:transform,opacity}
.k{color:var(--fire)}

/* slide 1 */
.num{will-change:opacity,transform;position:absolute;left:0;right:0;bottom:calc(46% + 12px);text-align:center;font-family:var(--font-serif);font-size:min(36vh,30vw);line-height:.92;letter-spacing:-.01em;color:var(--light);text-shadow:0 2px 24px rgba(11,7,6,.4);opacity:0;z-index:12;animation:flt 9s ease-in-out infinite alternate}
.num.cost{font-size:min(36vh,19vw)}
.t1{top:calc(54% + 4.5vh);font-size:7vh}
.t1.big{font-size:10.5vh}
.wv{animation:wv 7s ease-in-out infinite alternate}
@keyframes wv{from{transform:translateX(-14px);opacity:.25}to{transform:translateX(14px);opacity:.6}}
.creep{animation:creep 7s ease-in-out infinite alternate}
@keyframes creep{from{transform:scale(var(--a))}to{transform:scale(var(--b))}}

/* thread */
.thr{position:absolute;left:0;top:0;width:0;height:3px;transform:translate(-50%,-50%);background:var(--fire);border-radius:2px;z-index:20;pointer-events:none;opacity:0;transition-property:left,top,width,height,opacity,transform;transition-timing-function:cubic-bezier(.65,0,.25,1)}

/* panels */
.bdw,.bdz,.ph,.dark,.day{position:absolute;inset:0}
.panel{position:absolute;top:0;height:100%;width:33.3334%;overflow:hidden}
.ph{transform:translateY(105%)}
.day{--m:-14%;-webkit-mask-image:linear-gradient(90deg,#000 calc(var(--m) - 14%),transparent var(--m));mask-image:linear-gradient(90deg,#000 calc(var(--m) - 14%),transparent var(--m))}
.day.rev{--m:114%}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 90% 34% at 50% 50%,rgba(11,7,6,.66),rgba(11,7,6,0) 100%),rgba(11,7,6,.16);pointer-events:none}
.pt{top:0;bottom:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;font-size:clamp(24px,4.8vh,56px);padding:0 8%}
#wave{position:absolute;top:-10%;bottom:-10%;left:0;width:34vw;transform:translateX(-40vw);background:linear-gradient(90deg,transparent,rgba(255,236,200,.5) 50%,transparent);mix-blend-mode:screen;filter:blur(10px);pointer-events:none;z-index:15}
.fl{position:absolute;display:block;border-radius:50% 50% 45% 45%/70% 70% 30% 30%;background:radial-gradient(ellipse 50% 60% at 50% 78%,#fff0b8 0%,#ffb12e 22%,#ff5a0a 52%,rgba(255,60,0,0) 74%);mix-blend-mode:screen;filter:blur(5px);transform-origin:50% 100%;animation:flk .5s ease-in-out infinite alternate;margin-left:-8%}
@keyframes flk{0%{transform:scale(1,.82) translateX(-3%) skewX(-5deg);opacity:.8}50%{transform:scale(1.1,1.18) translateX(3%) skewX(5deg);opacity:1}100%{transform:scale(.92,.95) translateX(-1%) skewX(-2deg);opacity:.9}}
.glw{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(255,150,50,.7),transparent 65%);animation:glw 1.4s linear infinite}
@keyframes glw{0%{opacity:.55}20%{opacity:.95}40%{opacity:.62}70%{opacity:1}100%{opacity:.7}}
.gr{transform-box:fill-box;transform-origin:50% 100%;animation:sw 1.3s ease-in-out infinite alternate}
@keyframes sw{from{transform:skewX(-3deg)}to{transform:skewX(4deg)}}
.pls{animation:pls 1.3s ease-in-out infinite alternate}
@keyframes pls{from{opacity:.5}to{opacity:1}}
.scr{position:absolute;left:0;top:0;width:200%;height:100%;animation:scr linear infinite}
@keyframes scr{to{transform:translateX(-50%)}}
.scr svg{width:100%;height:100%;display:block}
.drone{position:absolute;left:50%;top:34%;width:78%;transform:translate(-50%,-50%);animation:dr 5s ease-in-out infinite alternate}
@keyframes dr{0%{transform:translate(-56%,-48%) rotate(-3deg)}100%{transform:translate(-44%,-54%) rotate(3deg)}}
.drv{transform-origin:300px 520px}
.away{animation:away var(--t,7s) cubic-bezier(.25,.5,.4,1) infinite backwards}
@keyframes away{0%{transform:scale(1.2);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:scale(.03);opacity:0}}
.onc{animation:onc var(--t,7s) cubic-bezier(.6,0,.9,.55) infinite backwards}
@keyframes onc{0%{transform:scale(.03);opacity:0}8%{opacity:1}100%{transform:scale(1.5);opacity:1}}

/* slide 4 */
#bg4{position:absolute;inset:0;overflow:hidden}
.scrim4{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,7,6,.74) 0,rgba(11,7,6,.5) 36%,rgba(11,7,6,0) 64%);z-index:3;pointer-events:none}
.l4{left:10vw;right:auto;width:38vw;text-align:left;padding:0}
.h4{top:22%;font-size:min(11vh,5.8vw);letter-spacing:-.01em}
.p4{top:50%;font-size:4.6vh;line-height:1.1}
.lapw4{position:absolute;right:2.5vw;bottom:14vh;width:min(50vw,84vh);--lw:min(50vw,84vh);perspective:1800px;z-index:4}
.lap.sway4{animation:lsw4 9s ease-in-out infinite alternate}
@keyframes lsw4{from{transform:rotateY(-12deg) rotateX(3deg)}to{transform:rotateY(-7deg) rotateX(1.5deg)}}

/* overlays */
#lab{position:absolute;left:4vw;top:calc(3.2vh + env(safe-area-inset-top,0px));z-index:60;pointer-events:none;font-family:var(--font-sans);font-weight:700;font-size:max(11px,1.4vh);line-height:1;text-transform:uppercase;letter-spacing:.2em;color:var(--ink);background:var(--paper);padding:.85em 1.1em .8em 1.3em;border-radius:6px;box-shadow:var(--shadow-md);opacity:0}
#lab:empty{display:none}
/* ===== slides 5 to 12 ===== */
.tall{position:absolute;left:-6%;right:-6%;top:-6%;height:142%}
.tall svg{width:100%;height:100%;display:block}
.rise{position:absolute;inset:0}
.mist{position:absolute;left:-20%;width:140%;height:16%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);filter:blur(14px);animation:smk 30s ease-in-out infinite alternate}
.scrim5{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(11,7,6,.62));z-index:4;pointer-events:none}
#dot{position:absolute;left:0;top:0;width:0;height:0;z-index:21;opacity:0;pointer-events:none;will-change:transform}
#dot i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--fire);border:2px solid var(--light);box-sizing:border-box;transition:transform .4s,opacity .4s}
@keyframes dpl{from{filter:brightness(.9)}to{filter:brightness(1.35)}}
#dot b{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,140,60,.7);animation:rp 1.8s ease-out infinite}
@keyframes rp{from{transform:scale(.3);opacity:.9}to{transform:scale(1.6);opacity:0}}
#dot svg{position:absolute;left:0;top:0;width:24px;height:32px;opacity:0;transition:opacity .4s}
#dot.cur i{transform:scale(.2);opacity:0}
#dot.cur svg{opacity:1}
.stop{position:absolute;top:0;bottom:0;width:30vw;margin-left:-15vw;z-index:13;pointer-events:none}
.stop .lb{position:absolute;left:0;right:0;bottom:calc(20% + 2.2vh);text-align:center;font-weight:600;font-size:max(12px,1.6vh);text-transform:uppercase;letter-spacing:.24em;color:var(--light);opacity:0;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.stop .sd{top:calc(80% + 2.8vh);font-size:3.5vh;line-height:1.1;padding:0 1vw}
.heat{position:absolute;left:10%;top:18%;width:80%;height:44%;display:grid;grid-template-columns:repeat(28,1fr);grid-template-rows:repeat(12,1fr);gap:2px;opacity:0;z-index:5;mix-blend-mode:screen;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at 62% 48%,#000 28%,transparent 76%);mask-image:radial-gradient(ellipse at 62% 48%,#000 28%,transparent 76%)}
.heat i{display:block;border-radius:2px;background:var(--c);animation:hp 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes hp{0%,100%{opacity:.22}50%{opacity:.95}}
.ph5{position:absolute;left:50%;top:15%;height:42vh;aspect-ratio:1/2;transform:translateX(-50%);opacity:0;z-index:6}
.ph5 svg{position:relative;width:100%;height:100%;display:block}

.dr5w{position:absolute;left:0;top:12%;width:100%;opacity:0;z-index:6;pointer-events:none}
.dr5{width:20vw;animation:dr5 12s linear infinite}
@keyframes dr5{0%{transform:translate(-26vw,0) rotate(4deg)}25%{transform:translate(18vw,-3vh) rotate(-2deg)}50%{transform:translate(52vw,1vh) rotate(3deg)}75%{transform:translate(84vw,-2vh) rotate(-3deg)}100%{transform:translate(112vw,2vh) rotate(2deg)}}

/* slide 6 */
#s6{background:radial-gradient(120% 70% at 50% 115%,rgba(229,50,31,.22),transparent 60%),var(--ground)}
.lapw{position:absolute;left:0;right:0;bottom:9%;display:flex;justify-content:center;perspective:1800px;--lw:min(58vw,92vh);z-index:3}
.lap{position:relative;width:var(--lw);transform-style:preserve-3d;transform:rotateY(-8deg) rotateX(3deg)}
.lap.sway{animation:lsw 9s ease-in-out infinite alternate}
@keyframes lsw{from{transform:rotateY(-8deg) rotateX(3deg)}to{transform:rotateY(-3.5deg) rotateX(1.5deg)}}
.lid{width:100%;aspect-ratio:16/10;background:#08080a;border-radius:calc(var(--lw)*.014);padding:calc(var(--lw)*.011);box-shadow:0 0 0 2px #26262a,0 30px 70px rgba(0,0,0,.35)}
.dash{width:100%;height:100%;background:#0e1012;border-radius:calc(var(--lw)*.006);display:flex;flex-direction:column;overflow:hidden;--u:calc(var(--lw)/100);font-size:calc(var(--u)*1.3);color:var(--light);position:relative}
.dtop{display:flex;align-items:center;gap:calc(var(--u)*1.6);height:8%;padding:0 calc(var(--u)*1.6);border-bottom:1px solid #22262b;flex:none}
.dbr{font-family:var(--font-serif);font-weight:400;color:var(--fire);font-size:calc(var(--u)*1.9);letter-spacing:.04em}
.dtab{opacity:.5}
.dtab.on{opacity:1;border-bottom:2px solid var(--fire);padding-bottom:calc(var(--u)*.4)}
.dsp{flex:1}
.dchip{background:rgba(229,50,31,.16);color:#ffb070;padding:calc(var(--u)*.4) calc(var(--u)*1);border-radius:99px;font-size:calc(var(--u)*1.05)}
.dbody{display:flex;flex:1;min-height:0}
.dside{width:19%;border-right:1px solid #22262b;padding:calc(var(--u)*1.2);display:flex;flex-direction:column;gap:calc(var(--u)*.7)}
.dh{font-variant-caps:all-small-caps;letter-spacing:.2em;opacity:.55;font-size:calc(var(--u)*1.1)}
.dr,.dm{display:flex;align-items:center;gap:calc(var(--u)*.7);padding:calc(var(--u)*.6) calc(var(--u)*.7);border-radius:calc(var(--u)*.5);font-size:calc(var(--u)*1.2)}
.dr.on{background:#1a1d20}
.dr i{width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;flex:none}
.dr em,.dm em{margin-left:auto;font-style:normal;opacity:.7;font-size:calc(var(--u)*1.05)}
.dmap{flex:1;position:relative;background:#0a1218;min-width:0}
.dmap svg{position:absolute;inset:0;width:100%;height:100%}
.dcard{position:absolute;right:3%;top:5%;width:30%;background:rgba(14,16,18,.9);border:1px solid #2a2e33;border-radius:calc(var(--u)*.8);padding:calc(var(--u)*1.2);opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.dcard.on{opacity:1;transform:none}
.ct{font-family:var(--font-serif);font-size:calc(var(--u)*2.2);margin-bottom:calc(var(--u)*.6)}
.cr{display:flex;justify-content:space-between;font-size:calc(var(--u)*1.1);padding:calc(var(--u)*.3) 0;border-top:1px solid #22262b}
.cr em{font-style:normal;color:#ff8a4a}
.lbase{width:112%;margin-left:-6%;height:calc(var(--lw)*.022);background:linear-gradient(#2c2c30,#101012);border-radius:0 0 calc(var(--lw)*.03) calc(var(--lw)*.03);box-shadow:0 24px 50px rgba(0,0,0,.65)}
.rz{transform-box:fill-box;transform-origin:50% 50%;animation:rz 2s ease-in-out infinite}
@keyframes rz{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.18);opacity:1}}
.wnd{animation:wnd 2.2s linear infinite}
@keyframes wnd{to{stroke-dashoffset:-36}}
.cap6{top:13vh;bottom:auto;font-size:5.4vh}

/* slide 7 */
.half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.hl{left:0}
.hr{right:0}
.half canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag7{top:11vh;font-size:5.4vh}
.hot7{color:var(--fire)}
.resp{top:auto;bottom:8.5vh;font-size:3.3vh}
.urg{color:var(--light)}

.half::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(11,7,6,.45),rgba(11,7,6,0) 35%,rgba(11,7,6,0) 55%,rgba(11,7,6,.55));pointer-events:none}

/* slide 8 */
.hw8{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#03050a,#0a101c 52%,#10151f);filter:blur(7px);transform:scale(1.06)}
.road8{position:absolute;left:0;right:0;top:50%;bottom:0;background:linear-gradient(#0a0e16,#05070b)}
.fire8{position:absolute;left:-12%;top:26%;width:60%;height:34%;background:radial-gradient(ellipse,rgba(229,50,31,.5),transparent 70%);animation:glw 1.6s linear infinite}
.sl8{position:absolute;top:30%;width:10px;height:10px;border-radius:50%;background:#ffb04a;box-shadow:0 0 30px 10px rgba(255,170,70,.5);animation:bl 3s ease-in-out infinite alternate}
.bk8{position:absolute;left:0;border-radius:50%;animation:bk8 linear infinite}
@keyframes bk8{from{transform:translateX(-14vw)}to{transform:translateX(114vw)}}
.hwrap{position:absolute;left:50%;top:50%;width:min(88vh,92vw);aspect-ratio:600/800;transform:translate(-50%,-47%);z-index:3}
.handw{position:absolute;inset:0}
.hshake{position:absolute;inset:0;animation:hsw 6s ease-in-out infinite alternate}
@keyframes hsw{from{transform:translate(-.6%,.6%) rotate(-.4deg)}to{transform:translate(.6%,-.4%) rotate(.5deg)}}
.hshake>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:none}
.phone8{position:absolute;left:29.17%;top:4.5%;width:41.67%;height:65%;container-type:inline-size;border-radius:12%/5.8%;background:#050507;box-shadow:0 0 0 1.5px #2a2a30,0 20px 50px rgba(0,0,0,.4)}
.p8scr{position:absolute;inset:2.4cqw;border-radius:10.4cqw;background:linear-gradient(#0c0f16,#06070b);overflow:hidden;display:flex;flex-direction:column;padding:5cqw;gap:3cqw;font-size:4.4cqw}
.p8st{display:flex;justify-content:space-between;font-weight:600;font-size:4cqw;opacity:.8}
.p8hd{display:flex;align-items:center;gap:2.5cqw;font-weight:600;font-size:4.6cqw;margin-top:2cqw}
.p8hd i{width:7cqw;height:7cqw;border-radius:50%;background:var(--fire);box-shadow:none}
.p8bub{background:#1e2229;border-radius:4.5cqw 4.5cqw 4.5cqw 1cqw;padding:3.6cqw 4cqw;font-size:4.6cqw;line-height:1.28;opacity:0}
.p8map{height:78cqw;border-radius:4cqw;overflow:hidden;transform-origin:50% 0;transform:scaleY(0);opacity:0;background:#0a1118;border:1px solid #232a33;flex:none}
.p8map svg{width:100%;height:100%;display:block}
.cap8{top:auto;bottom:4vh;font-size:6.2vh;z-index:14}
#route8{filter:none}

/* slide 9 */
#archSvg{position:absolute;inset:0;width:100%;height:100%}
.archl{fill:none;stroke:var(--fire);stroke-width:3;stroke-linecap:round;filter:none}
.archf{fill:none;stroke:#fff1d0;stroke-width:1.5;stroke-dasharray:3 22;opacity:.6;animation:af 1.2s linear infinite}
@keyframes af{to{stroke-dashoffset:-25}}
#archN,#archP{position:absolute;inset:0;pointer-events:none}
.nd{position:absolute;width:0;height:0;--lit:0;z-index:15;opacity:0}
.nd .dn{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;box-sizing:border-box;background:rgba(229,50,31,var(--lit));border:2px solid rgba(255,247,242,calc(.4 + var(--lit)*.6))}
.nl{display:block;font-family:var(--font-serif);text-transform:uppercase;font-size:clamp(16px,3vh,34px);line-height:1.1;letter-spacing:.012em;color:var(--light);opacity:calc(.55 + var(--lit)*.45);text-shadow:0 1px 10px rgba(0,0,0,.35);overflow-wrap:break-word}
.nd.b .nl{position:absolute;left:34px;top:0;transform:translateY(-50%);width:var(--bw);text-align:left}
.nd.r .nl{position:absolute;left:calc(var(--bw)/-2);top:28px;width:var(--bw);text-align:center}
.pl{position:absolute;left:-7px;top:-7px;width:14px;height:14px;box-sizing:border-box;border-radius:50%;background:var(--light);border:3px solid var(--fire);opacity:0;z-index:22}

/* slide 10 */
.scrim10{position:absolute;inset:0;background:linear-gradient(90deg,transparent 20%,rgba(11,7,6,.55) 60%);z-index:8}
.ffw{position:absolute;left:14%;bottom:0;height:74%}
.ffw svg{height:100%;width:auto;display:block}
.num10{left:34%;right:2%;bottom:calc(43% + 1vh);font-size:min(30vh,19vw)}
.t10{left:34%;right:2%;top:calc(57% + 3.4vh);font-size:4.2vh}
.src10{position:absolute;left:34%;right:2%;bottom:6vh;text-align:center;font-weight:500;font-size:max(12px,1.9vh);letter-spacing:.04em;opacity:0;z-index:12;padding:0 3vw}

/* slide 11 */
.wide{position:absolute;left:0;top:0;width:200%;height:100%;animation:pan11 60s ease-in-out infinite alternate}
@keyframes pan11{from{transform:translateX(0)}to{transform:translateX(-45%)}}
.wide2{position:absolute;left:0;top:0;width:260%;height:100%;animation:pan11b 60s ease-in-out infinite alternate;pointer-events:none}
@keyframes pan11b{from{transform:translateX(0)}to{transform:translateX(-52%)}}
.wide svg,.wide2 svg{width:100%;height:100%;display:block}
.fk{animation:fk 2.6s linear infinite}
@keyframes fk{0%{opacity:.8}6%{opacity:.5}12%{opacity:.95}30%{opacity:.7}33%{opacity:1}55%{opacity:.6}70%{opacity:.9}100%{opacity:.8}}

<script>
/* global speed: 2 = every staged animation, transition and delay runs twice as fast */
const SPEED=2;
(function(){
 const st=window.setTimeout.bind(window);window.setTimeout=(f,ms,...a)=>st(f,(ms||0)/SPEED,...a);
 const now=performance.now.bind(performance);performance.now=()=>now()*SPEED;

const $=s=>document.querySelector(s);

/* read by the 3D scenes: when the forest on slide 1 caught fire */

/* ---------- procedural photographs ---------- */
function aerial(p){
 const r=R(14);
 const rid=(base,a,b,ph,col)=>{let d=`M0 900 L0 ${base}`;for(let x=0;x<=1600;x+=20)d+=` L${x} ${(base-a*(.55+.45*Math.sin(x*.0035+ph))-b*Math.sin(x*.012+ph*2)).toFixed(1)}`;return `<path d="${d} L1600 900Z" fill="${col}"/>`};
 let folds='';for(let i=0;i<22;i++){const x=r()*1600,y=210+r()*90;folds+=`<path d="M${x|0} ${y|0} L${(x+26+r()*30)|0} 392 L${(x-30-r()*20)|0} 392Z" fill="rgba(25,55,35,.14)"/>`}

 const bg=lay(svg('0 0 1600 900',`<defs>${sk('as'+p,[[0,'#8fbbd9'],[.3,'#bcd7e6'],[.46,'#e4eef0']])}</defs><rect width="1600" height="900" fill="url(#as${p})"/>${rid(330,60,10,.8,'#9db9b4')}${rid(385,110,18,2.1,'#5f8456')}${folds}${rid(410,22,8,4.0,'#7f9c5d')}`)+clouds,{d:40,s0:1.03,s1:1.1,x0:-1,x1:1});
 let tw=`<defs>${sk('tg'+p,[[0,'#86a35f'],[.5,'#a3a97a'],[1,'#b8ae86']])}</defs><rect y="388" width="1600" height="200" fill="url(#tg${p})"/>`;
 for(let i=0;i<4;i++)tw+=`<path d="M0 ${430+i*38} Q 400 ${420+i*38} 800 ${430+i*38} T 1600 ${428+i*38}" stroke="rgba(205,195,165,.7)" stroke-width="${2+i}" fill="none"/>`;

 for(let row=0;row<10;row++){const y=396+row*17,sc=.45+row*.1;for(let x=-20;x<1650;x+=(34+r()*20)*sc){const w=(22+r()*20)*sc,h=(12+r()*8)*sc;tw+=`<rect x="${x|0}" y="${y|0}" width="${w|0}" height="${h|0}" fill="${roofs[(r()*6)|0]}"/>`;if(r()>.6)tw+=`<circle cx="${(x+w+6*sc)|0}" cy="${(y+h*.4)|0}" r="${f1((5+r()*6)*sc)}" fill="#3e6a3a" opacity=".92"/>`}}

 const shore=lay(svg('0 0 1600 900',sea),{d:26,s0:1.05,s1:1.2,x0:-1,x1:2});
 return bg+town+shore;
}

function dotMove(getXY,dur,T){return new Promise(res=>{const x0=dotX,y0=dotY,t0=performance.now();dot.style.transition='none';(function f(n){if(T!==tok)return res(false);const p=Math.min(1,(n-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,[tx,ty]=getXY();placeDot(x0+(tx-x0)*e,y0+(ty-y0)*e);p<1?requestAnimationFrame(f):res(true)})(t0)})}
function lerpPts(a,b,dur,T,cb){return new Promise(res=>{const t0=performance.now();(function f(n){if(T!==tok)return res(false);const p=Math.min(1,(n-t0)/dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;cb(a.map((q,i)=>[q[0]+(b[i][0]-q[0])*e,q[1]+(b[i][1]-q[1])*e]));p<1?requestAnimationFrame(f):res(true)})(t0)})}

function ridgeLine(base,a,b,ph,seed){const r=R(seed);const pts=[];let d=`M0 1260 L0 ${base}`;for(let x=0;x<=1600;x+=16){const y=+(base+a*Math.sin(x*.0042+ph)+b*Math.sin(x*.011+ph*2.3)+r()*5).toFixed(1);pts.push([x,y]);d+=` L${x} ${y}`}return{d:d+' L1600 1260Z',pts}}

function spline(p){const n=p.length;let d=`M${p[0][0]} ${p[0][1]}`;for(let i=0;i<n;i++){const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0]} ${c[1]}`}return d+'Z'}

const DS_ITEMS=[{t:'Forecast',l:'Predicts where fires could start.'},{t:'Spark',l:'A fire is caught as it starts.'},{t:'Spread',l:'Active fires tracked in real time.'}];
function dsPlace(i,x,y,alt,ang){
 const d=$('#dsDrone'+i),sh=$('#dsShadow'+i),ft=$('#dsFoot'+i);
 d.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(ang+90).toFixed(1)}) scale(${(.6+.28*alt).toFixed(3)})`);
 sh.setAttribute('transform',`translate(${(x+alt*24).toFixed(1)} ${(y+alt*30).toFixed(1)}) scale(${(.6+.08*alt).toFixed(3)})`);sh.setAttribute('opacity',(1-.55*alt).toFixed(2));
 ft.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(ang+90).toFixed(1)})`);ft.setAttribute('opacity',(alt*.8).toFixed(2));
}
function patrol(T,onLift){
 const paths=PADS.map((_,i)=>$('#dsLoop'+i)),Ls=paths.map(p=>p.getTotalLength()),lift=1100,fly=9000,land=1100,rest=3000,cyc=lift+fly+land+rest,t0=performance.now(),angs=PADS.map(()=>-90);let lifted=false;
 const e=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
 (function f(n){if(T!==tok)return;
  PADS.forEach(([px,py],i)=>{const u=((n-t0-i*90)%cyc+cyc)%cyc;let x=px,y=py,alt=0;
   if(n-t0<i*90){dsPlace(i,x,y,0,angs[i]);return}
   if(u<lift){alt=e(u/lift);if(!lifted&&u>lift*.3){lifted=true;onLift&&onLift()}}
   else if(u<lift+fly){alt=1;const p=e((u-lift)/fly),q=paths[i].getPointAtLength(Ls[i]*p),q2=paths[i].getPointAtLength(Math.min(Ls[i],Ls[i]*p+4));x=q.x;y=q.y;if(q2.x!==q.x||q2.y!==q.y)angs[i]=Math.atan2(q2.y-q.y,q2.x-q.x)*180/Math.PI}
   else if(u<lift+fly+land)alt=1-e((u-lift-fly)/land);
   dsPlace(i,x,y,alt,angs[i])});
  requestAnimationFrame(f)})(t0);
}

const TSL={resp:'expo',agent:'ts',dash:'rust',dinfo:'node',db:'pg',api:'fastify',edge:'go',conn:'go',redis:'redis',sqlite:'sql',schema:'zod',orch:'py',worker:'py',ddata:'py',dsim:'py',runtime:'py'};
function buildTS(){
 const g=(x0,y0,x1,y1,t)=>`<rect class="tsg" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="16"/><rect class="tsgc" x="${x0+14}" y="${y0-12}" width="${t.length*9.6+26}" height="24" rx="5"/><text class="tsgt" x="${x0+27}" y="${y0+4.5}">${t.toUpperCase()}</text>`;
 const groups=g(958,330,1202,580,'Edge server')+g(1328,22,1572,270,'Demo infra')+g(1328,330,1572,450,'Drone');
 const edges=TSE.map((e,i)=>{const d='M'+e.p.map(q=>q.join(' ')).join(' L');const mk=(e.end===false?'':' marker-end="url(#tsah)"')+(e.both?' marker-start="url(#tsah)"':'');
  const lab=(e.l||[]).map(([x,y,t,a])=>`<text class="tsl" x="${x}" y="${y}" text-anchor="${a||'middle'}">${t}</text>`).join('');
  const code=e.code?'<text class="tsc" x="520" y="436">{ "zone_id": UUID,</text><text class="tsc" x="532" y="455">"task": … }</text>':'';
  return `<g class="tse" data-i="${i}"><path d="${d}" pathLength="1"${mk}/>${lab}${code}</g>`}).join('');
 const nodes=Object.entries(TSN).map(([k,[x,y,n,t]])=>`<g class="tsn${k==='api'?' acc':''}" id="tsn_${k}" transform="translate(${x} ${y})"><g class="tsni"><rect x="-100" y="-38" width="200" height="76" rx="12"/><image href="${LOGO[TSL[k]]}"${['rust','fastify','expo'].includes(TSL[k])?' class="ink"':''} x="-91" y="-14" width="28" height="28" preserveAspectRatio="xMidYMid meet"/>${k==='dsim'?`<image href="${LOGO.ts}" x="-72" y="3" width="14" height="14"/>`:''}<text class="tsnn" x="-55" y="${t?-3:6}">${n}</text>${t?`<text class="tsnt" x="-55" y="17">${t}</text>`:''}</g></g>`).join('');
 const model=tsModel();
 const note='<g class="tsnote"></g>';
 s13.innerHTML=`<div class="tsw"><svg viewBox="0 0 1600 860" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="tsbarclip"><rect x="20" y="166" width="590" height="9" rx="4.5"/></clipPath><marker id="tsah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7b7871"/></marker></defs><g class="tsgs">${groups}</g>${edges}${note}${nodes}${model}</svg></div>`;
}
buildTS();
async function enterTS(T,from){
 showEl(s13,2);
 if(from===2)leave(s4,1000,'fade',3);else{clearOthers(s13,'pan');arrive(s13,true)}
 setT(B,Th.fuseOff,0);setT(A,()=>({x:W/2,y:H-40,w:0,h:3,o:0}),900);
 const E='cubic-bezier(.2,.7,.2,1)';
 const gs=s13.querySelector('.tsgs'),es=[...s13.querySelectorAll('.tse')],note=s13.querySelector('.tsnote');
 [gs,note,...es,...es.map(e=>e.querySelector('path')),...TS_ORDER.map(k=>$('#tsn_'+k+' .tsni'))].forEach(e=>e.getAnimations().forEach(a=>a.cancel()));
 gs.animate([{opacity:0},{opacity:1}],{duration:900,delay:200,fill:'both'});
 TS_ORDER.forEach((k,i)=>$('#tsn_'+k+' .tsni').animate([{opacity:0,transform:'translateY(10px) scale(.96)'},{opacity:1,transform:'none'}],{duration:600,delay:300+i*90,easing:E,fill:'both'}));
 const d0=300+TS_ORDER.length*90;

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ---------- 3D backgrounds: one renderer, drawn into a canvas inside each slide ---------- */
const V=h=>new THREE.Vector3((h>>16&255)/255,(h>>8&255)/255,(h&255)/255);
const DPR=Math.min(devicePixelRatio||1,1.5);
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R3=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* the same noise in script and shader, so things can stand on the shader's terrain */
const fr=x=>x-Math.floor(x);
function hash(x,y){let a=fr(x*.1031),b=fr(y*.1031),c=a;const d=a*(b+33.33)+b*(c+33.33)+c*(a+33.33);a+=d;b+=d;c+=d;return fr((a+b)*c)}
function noise(x,y){const ix=Math.floor(x),iy=Math.floor(y);let fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
function fbm(x,y){let a=.5,s=0;for(let i=0;i<4;i++){s+=a*noise(x,y);x=x*2.03+17.1;y=y*2.03+17.1;a*=.5}return s}
/* L: frequency, relief, rise with distance, half-width of a flat road corridor (0 for none) */
function landAt(L,x,z){let h=(fbm(x*L.x,z*L.x)-.5)*L.y+L.z*Math.max(0,-z);if(L.w>0){const e=Math.min(1,Math.max(0,(Math.abs(x)-L.w)/8));h*=e*e*(3-2*e)}return h}

const NOISE=`
float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+17.1;a*=.5;}return s;}
uniform vec4 uLand;
float land(vec2 w){float h=(fbm(w*uLand.x)-.5)*uLand.y+uLand.z*max(0.,-w.y);if(uLand.w>0.)h*=smoothstep(uLand.w,uLand.w+8.,abs(w.x));return h;}
`;
/* uFire: origin x, origin z, radius, strength. fire(): x flame front, y burned ground behind it, z wide glow. */
const FIRE=`
const vec3 C_FIRE=vec3(.898,.196,.122),C_FLAME=vec3(1.,.478,.102),C_GLOW=vec3(1.,.725,.22),C_CHAR=vec3(.035,.02,.016);
uniform vec4 uFire;
float fireD(vec2 w){return length((w-uFire.xy)*vec2(.6,1.))+noise(w*.11)*9.+noise(w*.5)*2.-5.5-uFire.z;}
vec3 fire(vec2 w){float d=fireD(w);return uFire.w*vec3(exp(-d*d*.35),1.-smoothstep(-1.5,0.,d),exp(-d*d*.02));}
`;
/* the patch of ground each patrolling drone is looking at: brighter, with a line sweeping through it */
const SCAN=`uniform vec4 uScan[3];
float scan(vec2 w){float s=0.;for(int i=0;i<3;i++){vec2 q=abs(w-uScan[i].xy)-uScan[i].zw;
 float sweep=1.-smoothstep(0.,1.2,abs(w.y-uScan[i].y-uScan[i].w*(1.-2.*fract(uTime*.45))));
 s=max(s,(1.-smoothstep(-1.5,0.,max(q.x,q.y)))*(.8+sweep*1.4));}return s;}
`;
const LIGHT=`uniform float uTime;uniform vec3 uSun,uSunCol,uAmb,uFog;uniform vec2 uFogR;`;

/* everything in one world shares these, so the land, the trees and the fire agree */
function env(o){return{
 uTime:{value:0},uLand:{value:new THREE.Vector4(...o.land)},uFire:{value:new THREE.Vector4(0,0,0,0)},
 uSun:{value:new THREE.Vector3(...o.sun).normalize()},uSunCol:{value:V(o.sunCol)},uAmb:{value:V(o.amb)},
 uFog:{value:V(o.fog)},uFogR:{value:new THREE.Vector2(...o.fogR)},
 uWrap:{value:0},uCenter:{value:new THREE.Vector3()},uScan:{value:[new THREE.Vector4(),new THREE.Vector4(),new THREE.Vector4()]},uScanOn:{value:0},uPixel:{value:DPR}}}

function makeLand(U,o){
 const g=new THREE.PlaneGeometry(o.w,o.d,o.sx,o.sz);g.rotateX(-Math.PI/2);
 const m=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:{...U,uLow:{value:V(o.low)},uHigh:{value:V(o.high)}},
  vertexShader:`${NOISE}varying vec3 vP;
   void main(){vec4 w=modelMatrix*vec4(position,1.);w.y=land(w.xz);vP=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`${LIGHT}${NOISE}${FIRE}uniform vec3 uLow,uHigh;uniform float uScanOn;${SCAN}varying vec3 vP;
   void main(){
    vec3 n=normalize(cross(dFdx(vP),dFdy(vP)));if(n.y<0.)n=-n;
    vec3 col=mix(uLow,uHigh,noise(vP.xz*.3)*.6+noise(vP.xz*1.7)*.4)*(uAmb+uSunCol*max(dot(n,uSun),0.));
    vec3 f=fire(vP.xz);
    float coals=noise(vP.xz*2.2+vec2(0.,uTime*.15));
    col=mix(col,mix(C_CHAR,vec3(.55,.1,.03),pow(coals,3.)*.9),f.y*.92);
    col+=vec3(1.,.38,.08)*f.z*.3;
    float front=min(f.x*(.7+.6*noise(vP.xz*1.4+vec2(0.,uTime*2.5))),1.);
    vec3 fl=mix(mix(C_FIRE,C_FLAME,smoothstep(.2,.7,front)),C_GLOW,smoothstep(.75,1.,front));
    col=mix(col,fl,smoothstep(.05,.5,front));
    col*=1.+uScanOn*scan(vP.xz);
    gl_FragColor=vec4(mix(col,uFog,smoothstep(uFogR.x,uFogR.y,length(vP-cameraPosition))),1.);
   }`}));
 m.frustumCulled=false;m.position.z=o.z??0;return m}

/* instances carry x, z, scale and a seed; the shader stands them on the terrain */
function instanced(src,bases){
 const g=new THREE.InstancedBufferGeometry();
 g.setAttribute('position',src.getAttribute('position'));
 if(src.getAttribute('normal'))g.setAttribute('normal',src.getAttribute('normal'));
 if(src.index)g.setIndex(src.index);
 g.setAttribute('aBase',new THREE.InstancedBufferAttribute(bases,4));
 g.instanceCount=bases.length/4;return g}
function merge(parts,cols){
 const flat=parts.map(p=>p.index?p.toNonIndexed():p),n=flat.reduce((a,p)=>a+p.getAttribute('position').count,0),pos=new Float32Array(n*3),col=cols&&new Float32Array(n*3);let o=0;
 flat.forEach((p,k)=>{const c=p.getAttribute('position').count;pos.set(p.getAttribute('position').array,o*3);if(col)for(let i=0;i<c;i++)col.set(cols[k],(o+i)*3);o+=c});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));if(col)g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();return g}
const WRAP=`uniform float uWrap;uniform vec3 uCenter;
vec2 wrapped(vec2 b){return uWrap>0.?b+uWrap*floor((uCenter.xz-b)/uWrap+.5):b;}`;

const TREE=merge([
 new THREE.CylinderGeometry(.09,.13,.5,4,1,true).translate(0,.25,0),
 new THREE.ConeGeometry(.62,1.25,6,1,true).translate(0,1.05,0),
 new THREE.ConeGeometry(.44,1.15,6,1,true).translate(0,1.85,0)]);
function makeTrees(U,bases,o){
 const m=new THREE.Mesh(instanced(TREE,bases),new THREE.ShaderMaterial({
  uniforms:{...U,uLeafA:{value:V(o.leafA)},uLeafB:{value:V(o.leafB)},uTrunk:{value:V(o.trunk)},uClear:{value:o.clear??.36}},
  vertexShader:`${LIGHT}${NOISE}${FIRE}${WRAP}attribute vec4 aBase;uniform vec3 uLeafA,uLeafB,uTrunk;uniform float uClear,uScanOn;${SCAN}varying vec3 vCol;varying float vDist;
   void main(){
    vec2 b=wrapped(aBase.xy);
    float keep=smoothstep(uClear,uClear+.08,noise(b*.045+7.));
    if(uLand.w>0.)keep*=step(uLand.w+4.,abs(b.x));
    float a=aBase.w*6.283,c=cos(a),s=sin(a),fol=step(.44,position.y);
    vec3 p=position,n=normal;p.xz=mat2(c,-s,s,c)*p.xz;n.xz=mat2(c,-s,s,c)*n.xz;
    vec3 f=fire(b);
    p.xz*=1.-.5*f.y*fol;p.y*=1.-.2*f.y*fol;
    p.x+=sin(uTime*1.3+b.x*.3+b.y*.2+aBase.w*6.)*.035*position.y*position.y;
    vec3 w=vec3(b.x,land(b),b.y)+p*aBase.z*keep;
    vec3 alb=mix(uTrunk,mix(uLeafA,uLeafB,fract(aBase.w*7.3)),fol)*(.5+.5*smoothstep(.4,2.2,position.y));
    vec3 col=alb*(uAmb+uSunCol*max(dot(n,uSun),0.));
    col*=1.+uScanOn*scan(b);
    col+=(alb*3.+.05)*vec3(1.,.4,.1)*f.z;
    col=mix(col,C_CHAR,f.y*.94);
    float hot=min(f.x*1.3,1.);
    col=mix(col,mix(C_FIRE,C_FLAME,hot),hot*.85*fol);
    col+=f.y*fol*vec3(.5,.09,.02)*step(.7,fract(aBase.w*13.1))*(.5+.5*sin(uTime*3.+aBase.w*40.));
    vec4 mv=viewMatrix*vec4(w,1.);vDist=length(mv.xyz);vCol=col;gl_Position=projectionMatrix*mv;
   }`,
  fragmentShader:`uniform vec3 uFog;uniform vec2 uFogR;varying vec3 vCol;varying float vDist;
   void main(){gl_FragColor=vec4(mix(vCol,uFog,smoothstep(uFogR.x,uFogR.y,vDist)),1.);}`}));
 m.frustumCulled=false;return m}

/* a backdrop drawn from the view direction: zenith to horizon, a sun, and a glow along the horizon */
function makeSky(U,cam,o){
 const u={uFog:U.uFog,uSun:U.uSun,uZen:{value:V(o.zen)},uDisc:{value:V(o.disc??0)},uHaze:{value:V(o.haze??0)},uGlow:{value:new THREE.Vector3()},uGlowDir:{value:new THREE.Vector2(0,-1)},
  uInvProj:{value:cam.projectionMatrixInverse},uCamWorld:{value:cam.matrixWorld}};
 const m=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:u,depthTest:false,depthWrite:false,
  vertexShader:`uniform mat4 uInvProj,uCamWorld;varying vec3 vDir;
   void main(){gl_Position=vec4(position.xy,1.,1.);vec4 v=uInvProj*vec4(position.xy,1.,1.);vDir=(uCamWorld*vec4(v.xyz/v.w,0.)).xyz;}`,
  fragmentShader:`uniform vec3 uFog,uSun,uZen,uDisc,uHaze,uGlow;uniform vec2 uGlowDir;varying vec3 vDir;
   void main(){
    vec3 d=normalize(vDir);float y=max(d.y,0.);
    vec3 col=mix(uFog,uZen,smoothstep(0.,.5,y));
    float s=max(dot(d,uSun),0.);
    col+=uHaze*pow(s,6.)+uDisc*smoothstep(.99972,.99986,s);
    col+=uGlow*exp(-y*y*70.)*(.55+.45*dot(normalize(d.xz),uGlowDir));
    gl_FragColor=vec4(col,1.);
   }`}));

const VIEWS={};

/* ---------- flames, embers and smoke: all read the same fire field as the land ---------- */
const QUAD=new THREE.PlaneGeometry(1,1).translate(0,.5,0);
function makeFlames(U,bases){
 const m=new THREE.Mesh(instanced(QUAD,bases),new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`${LIGHT}${NOISE}${FIRE}attribute vec4 aBase;varying vec2 vUv;varying float vSeed,vFade;
   void main(){
    vec2 b=aBase.xy;float d=fireD(b);
    float I=uFire.w*((1.-smoothstep(-1.,1.5,d))*smoothstep(-24.,-3.,d)+.3*(1.-smoothstep(-1.,0.,d))*step(.75,fract(aBase.w*5.7)));
    float size=aBase.z*(1.8+2.2*fract(aBase.w*3.1))*I*(.85+.3*sin(uTime*6.+aBase.w*30.));
    vec4 mv=viewMatrix*vec4(b.x,land(b)+.2*aBase.z,b.y,1.);
    mv.xy+=vec2(position.x*.75,position.y)*size;
    vUv=vec2(position.x+.5,position.y);vSeed=aBase.w;
    vFade=1.-.6*smoothstep(uFogR.x,uFogR.y,length(mv.xyz));
    gl_Position=projectionMatrix*mv;
   }`,
  fragmentShader:`${LIGHT}${NOISE}${FIRE}varying vec2 vUv;varying float vSeed,vFade;
   void main(){
    float n=noise(vec2(vUv.x*3.+vSeed*10.,vUv.y*2.5-uTime*2.4+vSeed*7.)),n2=noise(vec2(vUv.x*7.+vSeed*3.,vUv.y*5.-uTime*3.8));
    float m=1.-abs(vUv.x-.5)*2.-vUv.y*(.7+.6*n)+(n2-.5)*.4;
    vec3 col=mix(mix(mix(C_FIRE,C_FLAME,smoothstep(0.,.25,m)),C_GLOW,smoothstep(.25,.55,m)),vec3(1.,.9,.7),smoothstep(.6,.95,m));
    gl_FragColor=vec4(col,smoothstep(0.,.22,m)*smoothstep(0.,.14,vUv.y)*vFade*.7);
   }`}));

function makeEmbers(U,pts){
 const n=pts.length/2,pos=new Float32Array(n*3),seed=new Float32Array(n),r=R3(31);
 for(let i=0;i<n;i++){pos[i*3]=pts[i*2];pos[i*3+2]=pts[i*2+1];seed[i]=r()}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
 const m=new THREE.Points(g,new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`${LIGHT}${NOISE}${FIRE}attribute float aSeed;uniform float uPixel;varying float vA,vHeat;
   void main(){
    vec2 w=position.xz;float ph=fract(uTime*(.1+.18*fract(aSeed*7.31))+aSeed),sway=uTime*1.3+aSeed*40.;
    vec4 mv=viewMatrix*vec4(w.x+sin(sway)*1.2*ph+ph*9.,land(w)+.5+ph*(4.+ph*24.),w.y+cos(sway*.8)*1.2*ph,1.);
    vHeat=1.-ph;vA=fire(w).z*vHeat*smoothstep(0.,.08,ph)*(1.-.7*smoothstep(uFogR.x,uFogR.y,-mv.z));
    gl_Position=projectionMatrix*mv;
    gl_PointSize=uPixel*(.5+1.2*fract(aSeed*13.7))*mix(1.,.3,ph)*(300./-mv.z)*step(.03,vA);
   }`,
  fragmentShader:`varying float vA,vHeat;
   void main(){float soft=1.-smoothstep(0.,.5,length(gl_PointCoord-.5));
    gl_FragColor=vec4(mix(vec3(1.,.3,.1),vec3(1.,.8,.35),vHeat*vHeat),min(soft*vA*1.6,1.));}`}));
 m.frustumCulled=false;m.renderOrder=4;return m}

function makeSmoke(U,bases){
 const m=new THREE.Mesh(instanced(QUAD,bases),new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,
  vertexShader:`${LIGHT}${NOISE}${FIRE}attribute vec4 aBase;varying vec2 vUv;varying float vSeed,vA,vLit;
   void main(){
    vec2 b=aBase.xy;vec3 f=fire(b);
    float ph=fract(uTime*(.018+.02*fract(aBase.w*7.))+aBase.w);
    vec4 mv=viewMatrix*vec4(b.x+ph*30.,land(b)+1.+ph*(26.+22.*fract(aBase.w*3.)),b.y,1.);
    mv.xy+=vec2(position.x,position.y-.5)*aBase.z*(7.+30.*ph);
    vUv=vec2(position.x+.5,position.y);vSeed=aBase.w;
    vA=max(f.y,f.x)*smoothstep(0.,.12,ph)*(1.-smoothstep(.5,1.,ph))*.62;
    vLit=f.z*(1.-ph);
    gl_Position=projectionMatrix*mv;
   }`,
  fragmentShader:`${LIGHT}${NOISE}${FIRE}varying vec2 vUv;varying float vSeed,vA,vLit;
   void main(){
    float n=noise(vUv*3.+vSeed*20.+vec2(0.,-uTime*.06)),r=length(vUv-.5)*2.;
    vec3 col=mix(vec3(.06,.045,.04),vec3(.17,.13,.115),n)+vec3(.95,.32,.07)*vLit*.55*(1.-vUv.y);
    gl_FragColor=vec4(col,(1.-smoothstep(.15+.35*n,1.,r))*vA);

const FIELD=`
const float CELL=9.,PERIOD=16.,REACH=4.6;
float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}

float terrain(vec2 w){return fbm(w*.17);}

 for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){
  vec2 c=cell+vec2(float(i),float(j));float cycle=t/PERIOD+hash(c+3.1),phase=fract(cycle);vec2 key=c+floor(cycle)*17.;
  float live=step(.3,hash(key+9.7))*smoothstep(0.,.05,phase)*(1.-smoothstep(.72,1.,phase));
  vec2 origin=(c+.25+.5*vec2(hash(key+1.3),hash(key+5.9)))*CELL;
  float d=distance(w,origin)+wobble-1.1-REACH*(1.-(1.-phase)*(1.-phase));
  sum=max(sum,live*vec3(exp(-d*d*10.),1.-smoothstep(-.4,0.,d),exp(-d*d*1.4)));

function mapView(){

  vertexShader:`uniform vec2 uScroll;uniform float uRelief;varying vec2 vWorld;varying float vShade,vDistance;${FIELD}
   void main(){
    vec2 w=position.xz+uScroll;float e=.35;
    vec3 slope=normalize(vec3(terrain(w-vec2(e,0.))-terrain(w+vec2(e,0.)),2.*e/uRelief,terrain(w-vec2(0.,e))-terrain(w+vec2(0.,e))));
    vShade=dot(slope,normalize(vec3(-.5,.7,.4)));

   }`,
  fragmentShader:`uniform float uTime;uniform vec3 uFog;varying vec2 vWorld;varying float vShade,vDistance;${FIELD}
   float contour(float level){float width=fwidth(level);return(1.-smoothstep(0.,1.3,abs(fract(level-.5)-.5)/width))*(1.-smoothstep(.2,.55,width));}

   }`}));
