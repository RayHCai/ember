[project]
name = "ember-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false
# Ultralytics wants opencv-python; Demo Data and fire-seg use the headless build, and both in one
# environment fight over the same cv2 module.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.workspace]
members = [
  "services/demo-data",
  "services/drone-runtime",
  "services/operator-uagent",
  "services/planner",
  "tools/asset-builder",
  "tools/fire-seg",
  "tools/seed-data",
]

[dependency-groups]
dev = ["ruff>=0.13", "mypy>=1.18", "pytest>=8.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
