[project]
name = "ember-operator-uagent"
version = "0.0.0"
description = "Operator uAgent: a thin Agent Chat Protocol bridge from ASI:One to operator-agent."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "uagents>=0.26,<0.27",
  "uagents-core>=0.4,<0.5",
]

[project.scripts]
ember-operator-uagent = "ember_operator_uagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ember_operator_uagent"]

# Not a member of the root uv workspace: uagents pins protobuf below 6 through cosmpy, which would
# downgrade protobuf and onnx for drone-runtime and fire-seg. This package keeps its own lock.
[tool.uv]
package = true

[dependency-groups]
dev = ["ruff>=0.13", "mypy>=1.18", "pytest>=8.4", "anyio>=4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
