[project]
name = "ember-demo-data"
version = "0.1.0"
description = "Streams historical Lahaina (Aug 2023) wildfire imagery and a synthesized fire state to simulated drones."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "scipy>=1.13",
  "pillow>=10.4",
  "pyproj>=3.6",
  "shapely>=2.0",
  "rasterio>=1.3.10",
  "httpx>=0.27",
  "h5py>=3.11",
  "opencv-python-headless>=4.9,<5",
]

[project.scripts]
demo-data = "demo_data.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
