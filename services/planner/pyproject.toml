[project]
name = "ember-planner"
version = "0.0.0"
description = "Planner: a Redis-queue orchestrator and Celery workers for fire spread, response and evacuation plans."
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4",
  "httpx>=0.27",
  "numpy>=2.0",
  "pydantic>=2.8",
  "redis>=8.1.0",
  "scipy>=1.13",
  "shapely>=2.0",
]

[project.scripts]
ember-planner = "ember_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
