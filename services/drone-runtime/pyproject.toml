[project]
name = "ember-drone-runtime"
version = "0.0.0"
description = "Drone runtime: swarm mapping flight, camera capture, risk detection and upstream reporting."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pillow>=10.4",
  "websockets>=13",
]

[project.optional-dependencies]
yolo = ["onnxruntime>=1.18"]

[project.scripts]
drone-runtime = "ember_drone_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
